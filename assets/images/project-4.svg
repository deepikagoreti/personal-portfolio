<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p4Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p4Bg)" rx="16"/>
  
  <g transform="translate(60, 40)">
    <rect width="480" height="300" rx="12" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <path d="M0 12 Q0 0 12 0 L468 0 Q480 0 480 12 L480 36 L0 36 Z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="240" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">vitalpulse-analytics.io</text>
    
    <!-- Heart rate monitor line & Health widgets -->
    <rect x="25" y="55" width="200" height="105" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="78" font-family="sans-serif" font-size="11" fill="#94a3b8">BPM Heart Rate</text>
    <text x="40" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ec4899">72 <tspan font-size="12" fill="#cbd5e1">bpm</tspan></text>
    <path d="M40 135 H80 L90 120 L100 150 L110 110 L120 145 L130 135 H205" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round"/>

    <rect x="245" y="55" width="210" height="105" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="260" y="78" font-family="sans-serif" font-size="11" fill="#94a3b8">Daily Calories Burned</text>
    <text x="260" y="105" font-family="sans-serif" font-size="24" font-weight="bold" fill="#38bdf8">1,840 <tspan font-size="12" fill="#cbd5e1">kcal</tspan></text>
    <!-- Progress bar -->
    <rect x="260" y="125" width="180" height="10" rx="5" fill="#334155"/>
    <rect x="260" y="125" width="145" height="10" rx="5" fill="#38bdf8"/>

    <!-- Activity Bar Chart -->
    <rect x="25" y="175" width="430" height="105" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="40" y="196" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Weekly Step Counts</text>
    <g transform="translate(60, 205)">
      <rect x="0" y="25" width="22" height="40" rx="3" fill="#a855f7"/>
      <rect x="55" y="15" width="22" height="50" rx="3" fill="#a855f7"/>
      <rect x="110" y="30" width="22" height="35" rx="3" fill="#a855f7"/>
      <rect x="165" y="8" width="22" height="57" rx="3" fill="#ec4899"/>
      <rect x="220" y="18" width="22" height="47" rx="3" fill="#a855f7"/>
      <rect x="275" y="5" width="22" height="60" rx="3" fill="#38bdf8"/>
      <rect x="330" y="20" width="22" height="45" rx="3" fill="#a855f7"/>
    </g>
  </g>
</svg>
