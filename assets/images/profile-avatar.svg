<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
    <linearGradient id="hair" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="hoodie" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle with glow -->
  <circle cx="200" cy="200" r="180" fill="url(#avatarBg)" filter="url(#shadow)" />
  <circle cx="200" cy="200" r="172" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Back Hair -->
  <path d="M120 180 C110 260 110 310 130 350 C140 370 170 380 200 380 C230 380 260 370 270 350 C290 310 290 260 280 180 Z" fill="url(#hair)"/>

  <!-- Neck -->
  <rect x="180" y="240" width="40" height="45" rx="10" fill="url(#skin)" />
  <!-- Neck shadow -->
  <path d="M180 240 Q200 255 220 240 L220 250 Q200 265 180 250 Z" fill="#ea580c" opacity="0.2"/>

  <!-- Shoulders / Hoodie -->
  <path d="M100 380 C110 300 145 270 180 270 L220 270 C255 270 290 300 300 380 Z" fill="url(#hoodie)" />
  <path d="M180 270 L200 310 L220 270 Z" fill="#0369a1" />
  <!-- Tech lanyard -->
  <path d="M175 270 L195 380" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <path d="M225 270 L205 380" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
  <rect x="188" y="340" width="24" height="32" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="192" y="345" width="16" height="10" rx="2" fill="#3b82f6"/>
  <line x1="192" y1="360" x2="208" y2="360" stroke="#94a3b8" stroke-width="2"/>
  <line x1="192" y1="365" x2="204" y2="365" stroke="#94a3b8" stroke-width="2"/>

  <!-- Face -->
  <ellipse cx="200" cy="180" rx="65" ry="75" fill="url(#skin)" />

  <!-- Front Hair & Style -->
  <path d="M135 170 C135 110 160 90 200 90 C245 90 265 110 265 170 C265 185 260 170 255 155 C240 120 220 120 200 125 C175 130 155 135 145 155 C140 165 135 180 135 170 Z" fill="url(#hair)"/>

  <!-- Eyebrows -->
  <path d="M155 160 Q170 154 185 160" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M215 160 Q230 154 245 160" stroke="#1e1b4b" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="170" cy="175" r="7" fill="#1e1b4b" />
  <circle cx="172" cy="173" r="2.5" fill="#ffffff" />
  <circle cx="230" cy="175" r="7" fill="#1e1b4b" />
  <circle cx="232" cy="173" r="2.5" fill="#ffffff" />

  <!-- Stylish Glasses -->
  <rect x="150" y="162" width="40" height="26" rx="8" fill="none" stroke="#f59e0b" stroke-width="3.5" />
  <rect x="210" y="162" width="40" height="26" rx="8" fill="none" stroke="#f59e0b" stroke-width="3.5" />
  <path d="M190 172 L210 172" stroke="#f59e0b" stroke-width="3.5" />
  <path d="M150 172 L138 168" stroke="#f59e0b" stroke-width="3" />
  <path d="M250 172 L262 168" stroke="#f59e0b" stroke-width="3" />

  <!-- Nose -->
  <path d="M198 185 Q200 196 204 196" stroke="#ea580c" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Smile -->
  <path d="M185 212 Q200 226 215 212" stroke="#b91c1c" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Blush -->
  <ellipse cx="152" cy="195" rx="8" ry="4" fill="#fb7185" opacity="0.4" />
  <ellipse cx="248" cy="195" rx="8" ry="4" fill="#fb7185" opacity="0.4" />

  <!-- Modern Floating Code Badges -->
  <g transform="translate(45, 100)">
    <rect width="60" height="28" rx="14" fill="#0f172a" opacity="0.85"/>
    <text x="30" y="18" font-family="monospace" font-size="12" fill="#38bdf8" text-anchor="middle" font-weight="bold">&lt;dev/&gt;</text>
  </g>
  <g transform="translate(295, 120)">
    <rect width="68" height="28" rx="14" fill="#0f172a" opacity="0.85"/>
    <text x="34" y="18" font-family="monospace" font-size="12" fill="#a855f7" text-anchor="middle" font-weight="bold">{ CSE }</text>
  </g>
  <g transform="translate(290, 260)">
    <rect width="70" height="28" rx="14" fill="#0f172a" opacity="0.85"/>
    <text x="35" y="18" font-family="sans-serif" font-size="11" fill="#10b981" text-anchor="middle" font-weight="bold">★ React</text>
  </g>
</svg>
