<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#p2Bg)" rx="16"/>
  
  <g transform="translate(60, 40)">
    <rect width="480" height="300" rx="12" fill="#0f172a" stroke="#059669" stroke-width="2"/>
    <!-- Window Bar -->
    <path d="M0 12 Q0 0 12 0 L468 0 Q480 0 480 12 L480 36 L0 36 Z" fill="#1e293b"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <text x="240" y="22" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">swiftcart-store.dev</text>
    
    <!-- Hero banner in shop -->
    <rect x="20" y="50" width="440" height="70" rx="8" fill="url(#glow)"/>
    <text x="40" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Spring Electronics Sale</text>
    <text x="40" y="100" font-family="sans-serif" font-size="11" fill="#ecfdf5">Up to 40% off on developer peripherals &amp; smart tech</text>
    
    <!-- Product Grid -->
    <g transform="translate(20, 135)">
      <!-- Item 1 -->
      <rect width="135" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
      <rect x="15" y="12" width="105" height="65" rx="6" fill="#334155"/>
      <circle cx="67" cy="44" r="18" fill="#10b981"/>
      <text x="15" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Wireless Keyboard</text>
      <text x="15" y="112" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold">₹2,499</text>
      <rect x="15" y="122" width="105" height="20" rx="4" fill="#10b981"/>
      <text x="67" y="136" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">Add to Cart</text>
    </g>
    
    <g transform="translate(170, 135)">
      <!-- Item 2 -->
      <rect width="135" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
      <rect x="15" y="12" width="105" height="65" rx="6" fill="#334155"/>
      <rect x="50" y="30" width="35" height="30" rx="4" fill="#38bdf8"/>
      <text x="15" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">ANC Headphones</text>
      <text x="15" y="112" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold">₹4,999</text>
      <rect x="15" y="122" width="105" height="20" rx="4" fill="#10b981"/>
      <text x="67" y="136" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">Add to Cart</text>
    </g>

    <g transform="translate(325, 135)">
      <!-- Item 3 -->
      <rect width="135" height="150" rx="8" fill="#1e293b" stroke="#334155"/>
      <rect x="15" y="12" width="105" height="65" rx="6" fill="#334155"/>
      <polygon points="67,25 85,55 50,55" fill="#f59e0b"/>
      <text x="15" y="96" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f8fafc">Ergonomic Mouse</text>
      <text x="15" y="112" font-family="sans-serif" font-size="10" fill="#10b981" font-weight="bold">₹1,299</text>
      <rect x="15" y="122" width="105" height="20" rx="4" fill="#10b981"/>
      <text x="67" y="136" font-family="sans-serif" font-size="9" fill="#ffffff" text-anchor="middle" font-weight="bold">Add to Cart</text>
    </g>
  </g>
</svg>
